-icon{height:34px;width:34px;border-radius:10px;background:#ff7a1a16;color:var(--accent2);display:grid;place-items:center;font-size:18px}.stat-value{font-size:27px;font-weight:800;margin:18px 0 8px}.stat-foot{font-size:11px;color:var(--muted)}.green{color:var(--green)!important}.red{color:var(--red)!important}.orange{color:var(--accent2)!important}.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.card{padding:19px;margin-bottom:16px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.card-head h3{margin:0;font-size:14px}.muted{color:var(--muted)}.smalltext{font-size:11px}.chart{height:210px;display:flex;align-items:end;gap:12px;padding:10px 4px 0;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 49px,#252b33 50px)}.bar-col{height:100%;flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:8px}.bar{width:min(32px,70%);min-height:3px;border-radius:6px 6px 0 0;background:linear-gradient(0deg,#d94b00,var(--accent2));position:relative}.bar-label{font-size:10px;color:var(--muted);padding-bottom:9px}.bar-num{font-size:10px;color:var(--muted)}.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick{padding:14px;border:1px solid var(--line);border-radius:11px;background:#191e25;text-align:right;color:var(--text)}.quick:hover{border-color:#a95725;background:#211d19}.quick span{display:block;font-size:20px;margin-bottom:9px}.quick b{font-size:12px}.quick small{display:block;color:var(--muted);font-size:10px;margin-top:5px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:right;color:#8e99a5;font-size:11px;font-weight:500;padding:12px 10px;border-bottom:1px solid var(--line)}td{padding:13px 10px;border-bottom:1px solid #252b33;font-size:12px}tbody tr:hover{background:#ffffff05}.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-size:10px;background:#263b34;color:#6de2b0}.badge.expired{background:#43242a;color:#ff9299}.badge.warning{background:#40351f;color:#f7d27c}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.field{background:#101419;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:11px 12px;outline:none;min-width:0}.field:focus{border-color:#bd5d20}.search{flex:1;min-width:190px}.empty{padding:28px;text-align:center;color:var(--muted);font-size:12px}.page-title{font-size:23px;margin:0 0 8px}.page-desc{color:var(--muted);font-size:12px;margin:0 0 22px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.form-group{display:flex;flex-direction:column;gap:7px}.form-group label{font-size:11px;color:var(--muted)}.form-group .field{width:100%}.form-actions{display:flex;gap:10px;justify-content:flex-start;margin-top:18px}.notice{padding:13px 15px;border:1px solid #5c4025;background:#261d15;color:#ffbd83;border-radius:10px;font-size:12px;line-height:1.8;margin-bottom:16px}.scanner-box{display:flex;gap:10px;align-items:center;background:#11161b;border:1px dashed #735033;border-radius:12px;padding:15px}.scanner-box input{flex:1}.kpi-line{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);font-size:12px}.kpi-line strong{font-size:13px}.toast{position:fixed;bottom:22px;left:22px;background:#1d3028;border:1px solid #2e7657;color:#9af0c5;border-radius:10px;padding:13px 18px;z-index:50;box-shadow:var(--shadow);font-size:12px;display:none}.modal-back{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:18px;z-index:40}.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 25px 80px #0008}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-head h2{margin:0;font-size:18px}.close{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:7px 11px}.member-photo{width:38px;height:38px;object-fit:cover;border-radius:50%;border:1px solid var(--line);vertical-align:middle;margin-left:8px;background:var(--panel2)}.photo-preview{display:flex;align-items:center;gap:12px;margin-top:8px}.photo-preview img{width:72px;height:72px;border-radius:14px;object-fit:cover;border:1px solid var(--line);background:var(--panel2)}.credit{text-align:center;color:#737e89;font-size:10px;padding:18px 0 2px}.credit b{color:#c8a06d;font-weight:600}.mobile-menu{display:none}

<body><div id="loginScreen" style="display:none"></div><div class="app" id="mainApp"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark">F</div><div><strong>FORCE</strong><small>GYM MANAGEMENT</small></div></div><div class="nav-label">القائمة الرئيسية</div><nav class="nav" id="nav"><button class="active" data-page="dashboard"><span>▦</span>لوحة التحكم</button><button data-page="members"><span>♙</span>الأعضاء</button><button data-page="subscriptions"><span>▣</span>الاشتراكات</button><button data-page="attendance"><span>⌁</span>الحضور والانصراف</button><button data-page="treasury"><span>◈</span>الخزنة والمالية</button><button data-page="monthly"><span>▥</span>الأداء الشهري</button><button data-page="trainers"><span>♟</span>المدربون</button><button data-page="reports"><span>▤</span>التقارير</button><button data-page="settings"><span>⚙</span>الإعدادات</button></nav><div class="sidebar-foot">نظام إدارة <b>FORCE GYM</b><br>بيانات هذه النسخة التجريبية محفوظة محليًا على هذا المتصفح.<br><div class="credit">تصميم <b>مهندس علي أشرف</b></div></div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="close mobile-menu" onclick="toggleMenu()">☰</button><div><div class="top-title" id="topTitle">لوحة التحكم</div><div class="top-sub" id="today"></div></div></div><div class="top-actions"><button class="btn secondary small" id="themeToggle" onclick="toggleTheme()" title="تبديل الوضع الفاتح والداكن">🌙 داكن</button><span class="pill">● النظام يعمل محليًا</span><div class="avatar">FG</div></div></header><section class="content" id="content"></section></main></div><div class="toast" id="toast"></div><div class="modal-back" id="modalBack"><div class="modal"><div class="modal-head"><h2 id="modalTitle">إضافة عضو</h2><button class="close" onclick="closeModal()">إغلاق ✕</button></div><div id="modalBody"></div></div></div>
<script>
const KEY='force_gym_v1';let state=load();let page='dashboard';let editId=null;const titles={dashboard:'لوحة التحكم',members:'إدارة الأعضاء',subscriptions:'الاشتراكات',attendance:'الحضور والانصراف',treasury:'الخزنة والإدارة المالية',monthly:'الأداء الشهري',trainers:'إدارة المدربين',reports:'التقارير والإحصائيات',settings:'الإعدادات'};
function load(){try{let d=JSON.parse(localStorage.getItem(KEY))||fresh();d.members ||= [];d.payments ||= [];d.expenses ||= [];d.attendance ||= [];d.trainers ||= [];d.auditLog ||= [];d.settings ||= {};return d}catch{return fresh()}}function fresh(){return {members:[],payments:[],expenses:[],attendance:[],trainers:[],auditLog:[],settings:{gymName:'FORCE GYM',currency:'جنيه',alertDays:7,programCode:'',loginPin:'',loginBackground:''}}}function logAction(action,details=''){state.auditLog ||= [];state.auditLog.push({id:uid(),date:dateNow(),time:new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}),action,details});if(state.auditLog.length>1000)state.auditLog=state.auditLog.slice(-1000)}function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}function money(n){return (Number(n)||0).toLocaleString('ar-EG',{maximumFractionDigits:2})+' '+(state.settings.currency||'جنيه')}function dateNow(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function fmt(d){if(!d)return '—';return new Date(d+'T12:00:00').toLocaleDateString('ar-EG')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}function toggleMenu(){document.getElementById('sidebar').classList.toggle('open')}function activeMember(m){if(m.pauseUntil){if(dateNow()>m.pauseUntil)resumePausedMember(m);else if(dateNow()>=(m.pauseStart||dateNow())&&dateNow()<=m.pauseUntil)return false}return m.endDate>=dateNow()&&m.status!=='موقوف'}function statusBadge(m){if(m.pauseUntil&&dateNow()>=(m.pauseStart||dateNow())&&dateNow()<=m.pauseUntil)return '<span class="badge warning">موقوف مؤقتًا</span>';if(m.pauseUntil&&dateNow()<(m.pauseStart||dateNow()))return '<span class="badge warning">إيقاف مجدول</span>';if(m.status==='موقوف')return '<span class="badge warning">موقوف</span>';return activeMember(m)?'<span class="badge">نشط</span>':'<span class="badge expired">منتهي</span>'}
function openPause(id){let m=state.members.find(x=>x.id===id);if(!m)return;if(m.pauseUntil){if(confirm(`العضو ${m.name} لديه إيقاف ${m.pauseStart>dateNow()?'مجدولًا':'حتى '+fmt(m.pauseUntil)}. هل تريد إلغاء الإيقاف؟`)){if(m.pauseStart&&m.pauseStart<=dateNow()){let elapsed=Math.max(0,Math.floor((new Date(dateNow()+'T00:00:00Z')-new Date(m.pauseStart+'T00:00:00Z'))/86400000)+1);m.endDate=addDaysISO(m.endDate,Math.min(elapsed,Number(m.pauseDays)||0))}m.pauseStart='';m.pauseUntil='';m.pauseDays=0;m.status='نشط';logAction('إلغاء إيقاف اشتراك',m.name);save();toast('تم إلغاء الإيقاف واستئناف الاشتراك')}return}
openModal('إيقاف الاشتراك مؤقتًا',`<form onsubmit="savePause(event,'${m.id}')"><div class="notice">العضو: <b>${esc(m.name)}</b><br>تاريخ انتهاء الاشتراك الحالي: ${fmt(m.endDate)}<br>سيتم تمديد تاريخ الانتهاء تلقائيًا بعدد أيام الإيقاف.</div><div class="form-group"><label>عدد أيام الإيقاف</label><input class="field" type="number" name="days" min="1" max="365" value="7" required></div><div class="form-group"><label>بداية الإيقاف</label><input class="field" type="date" name="start" value="${dateNow()}" min="${dateNow()}" required></div><button class="btn" type="submit">تأكيد الإيقاف المؤقت</button></form>`)}
function savePause(e,id){e.preventDefault();let m=state.members.find(x=>x.id===id);if(!m)return;let f=new FormData(e.target),days=Math.max(1,Math.min(365,Number(f.get('days'))||1)),start=String(f.get('start')||dateNow());if(start<dateNow()){toast('تاريخ بداية الإيقاف لا يمكن أن يكون في الماضي');return}m.pauseStart=start;m.pauseDays=days;m.pauseUntil=addDaysISO(start,days-1);m.status=start<=dateNow()?'موقوف مؤقتًا':'نشط';logAction('إيقاف/جدولة اشتراك',`${m.name}: ${days} يومًا من ${start} إلى ${m.pauseUntil}`);save();closeModal();toast(start>dateNow()?`تمت جدولة الإيقاف من ${fmt(start)} لمدة ${days} يومًا`:`تم إيقاف الاشتراك ${days} يومًا، وسيُستأنف تلقائيًا`)}function todayRevenue(){return state.payments.filter(p=>p.date===dateNow()).reduce((a,p)=>a+Number(p.amount),0)}function monthRevenue(){let x=dateNow().slice(0,7);return state.payments.filter(p=>p.date?.startsWith(x)).reduce((a,p)=>a+Number(p.amount),0)}function monthExpenses(){let x=dateNow().slice(0,7);return state.expenses.filter(p=>p.date?.startsWith(x)).reduce((a,p)=>a+Number(p.amount),0)}function treasuryLocked(){if(window.treasuryPassOnce){window.treasuryPassOnce=false;return false}return !!state.settings.treasuryPin&&!window.treasuryOpen}function requireTreasury(next,section){window.pendingTreasuryAction=next;window.pendingTreasurySection=!!section;openModal('🔒 الخزنة محمية',`<form onsubmit="checkTreasuryPin(event)"><div class="notice">أدخل رمز الخزنة لعرض البيانات المالية.</div><div class="form-group"><label>رمز الخزنة</label><input class="field" name="pin" type="password" inputmode="numeric" autocomplete="off" autofocus required></div><div class="form-actions"><button class="btn">فتح</button><button type="button" class="btn secondary" onclick="closeModal()">إلغاء</button></div></form>`)}function checkTreasuryPin(e){e.preventDefault();let v=String(e.target.pin.value||'').trim();if(v===String(state.settings.treasuryPin||'')){closeModal();let f=window.pendingTreasuryAction,sec=window.pendingTreasurySection;window.pendingTreasuryAction=null;if(f){if(sec){window.treasuryOpen=true;f()}else{window.treasuryPassOnce=true;f();window.treasuryPassOnce=false}}}else{toast('رمز الخزنة غير صحيح')}}function go(p){if(['treasury','monthly','reports'].includes(p)){if(treasuryLocked()){requireTreasury(()=>go(p),true);return}}else{window.treasuryOpen=false}page=p;document.getElementById('sidebar').classList.remove('open');render();playPageAnim()}function playPageAnim(){let c=document.getElementById('content');if(!c)return;c.classList.remove('page-enter');void c.offsetWidth;c.classList.add('page-enter')}document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});document.getElementById('today').textContent=new Date().toLocaleDateString('ar-EG',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
function render(){document.getElementById('topTitle').textContent=titles[page];let c=document.getElementById('content');let fn={dashboard:dashboardPage,members:membersPage,subscriptions:subscriptionsPage,attendance:attendancePage,treasury:treasuryPage,monthly:monthlyPage,trainers:trainersPage,reports:reportsPage,settings:settingsPage};c.innerHTML=fn[page]();applyBranding();}

function imageToData(file,maxSize,quality){return new Promise((resolve,reject)=>{if(!file||!file.type.startsWith('image/'))return reject(Error('اختر ملف صورة صالحًا'));const reader=new FileReader();reader.onerror=()=>reject(Error('تعذر قراءة الصورة'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(Error('الصورة غير صالحة'));img.onload=()=>{const scale=Math.min(1,maxSize/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',quality))};img.src=reader.result};reader.readAsDataURL(file)})}

function dashboardPage(){let active=state.members.filter(activeMember).length,expired=state.members.length-active;let bars=[];for(let i=5;i>=0;i--){let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);let key=d.toISOString().slice(0,7),val=state.payments.filter(p=>p.date?.startsWith(key)).reduce((a,p)=>a+Number(p.amount),0);bars.push({label:d.toLocaleDateString('ar-EG',{month:'short'}),val})}let max=Math.max(1,...bars.map(x=>x.val));let recent=[...state.payments].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);return `<div class="welcome"><div><h1>أهلاً بك في <span class="orange">${esc(state.settings.gymName||'FORCE GYM')}</span> 👋</h1><p>إليك ملخص أداء الجيم ونشاط اليوم.</p></div><button class="btn" onclick="openMember()">＋ إضافة عضو جديد</button></div><div class="stats">${stat('إجمالي الأعضاء',state.members.length,'♙','كل الأعضاء المسجلين')}${stat('الاشتراكات النشطة',active,'✓','أعضاء باشتراك ساري')}${stat('إيرادات اليوم',treasuryLocked()?'🔒':money(todayRevenue()),'↗','المدفوعات المسجلة اليوم')}${stat('إيرادات الشهر',treasuryLocked()?'🔒':money(monthRevenue()),'◈','إجمالي المحصل هذا الشهر')}</div><div class="card" style="margin-bottom:18px"><div class="card-head"><h3>🔔 تنبيهات الاشتراكات</h3><button class="btn secondary small" onclick="go('subscriptions')">عرض الاشتراكات</button></div><div class="kpi-line"><span>اشتراكات تنتهي خلال ${Number(state.settings.alertDays)||7} أيام</span><strong class="orange">${expiringMembers().length}</strong></div><div class="kpi-line"><span>اشتراكات منتهية</span><strong class="red">${state.members.filter(m=>!activeMember(m)&&m.status!=='موقوف').length}</strong></div></div><div class="grid2"><div class="card"><div class="card-head"><h3>📈 الإيرادات خلال آخر 6 أشهر</h3><span class="smalltext muted">${esc(state.settings.currency||'جنيه')}</span></div>${treasuryLocked()?'<div class="empty">🔒 الإيرادات محمية برمز الخزنة</div>':`<div class="chart">${bars.map(b=>`<div class="bar-col"><div class="bar-num">${b.val?esc(b.val.toLocaleString('ar-EG')):''}</div><div class="bar" style="height:${Math.max(3,b.val/max*70)}%" title="${b.val}"></div><div class="bar-label">${b.label}</div></div>`).join('')}</div>`}</div><div class="card"><div class="card-head"><h3>⚡ إجراءات سريعة</h3><span class="smalltext muted">اختصارات</span></div><div class="quick-grid"><button class="quick" onclick="openMember()"><span>♙</span><b>تسجيل عضو</b><small>إضافة بيانات مشترك</small></button><button class="quick" onclick="go('attendance')"><span>⌁</span><b>تسجيل حضور</b><small>بالرقم أو الباركود</small></button><button class="quick" onclick="openPayment()"><span>↗</span><b>تسجيل دفعة</b><small>تحصيل اشتراك</small></button><button class="quick" onclick="openExpense()"><span>◈</span><b>تسجيل مصروف</b><small>إضافة حركة مالية</small></button></div></div></div><div class="grid2"><div class="card"><div class="card-head"><h3>🧾 آخر المدفوعات</h3><button class="btn secondary small" onclick="go('treasury')">عرض الكل</button></div>${treasuryLocked()?'<div class="empty">🔒 المدفوعات محمية برمز الخزنة</div>':recent.length?`<div class="table-wrap"><table><thead><tr><th>العضو</th><th>التاريخ</th><th>المبلغ</th></tr></thead><tbody>${recent.map(p=>`<tr><td>${esc(p.memberName||'—')}</td><td>${fmt(p.date)}</td><td class="green">${money(p.amount)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">لا توجد مدفوعات مسجلة بعد.</div>'}</div><div class="card"><div class="card-head"><h3>⏳ اشتراكات تحتاج متابعة</h3><button class="btn secondary small" onclick="go('subscriptions')">عرض الاشتراكات</button></div>${expiringMembers().length?expiringMembers().slice(0,5).map(m=>`<div class="kpi-line"><span>${esc(m.name)} <small class="muted">#${m.number}</small></span><span class="orange">ينتهي ${fmt(m.endDate)}</span></div>`).join(''):'<div class="empty">لا توجد اشتراكات قريبة من الانتهاء.</div>'}</div></div><div class="credit">تصميم <b>مهندس علي أشرف</b> · FORCE Gym Management System</div>`}function stat(label,val,icon,foot){return `<div class="stat"><div class="stat-head"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-value">${val}</div><div class="stat-foot">${foot}</div></div>`}function expiringMembers(){let days=Number(state.settings.alertDays)||7;return state.members.filter(m=>m.endDate>=dateNow()&&m.endDate<=new Date(Date.now()+days*86400000).toISOString().slice(0,10)).sort((a,b)=>a.endDate.localeCompare(b.endDate))}
function membersPage(){return `<h1 class="page-title">إدارة الأعضاء</h1><p class="page-desc">قاعدة بيانات أعضاء FORCE وملفات اشتراكاتهم.</p><div class="toolbar"><input class="field search" id="memberSearch" placeholder="ابحث بالاسم أو الرقم أو الهاتف..." oninput="filterMembers()"><select class="field" id="memberFilter" onchange="filterMembers()"><option value="all">كل الحالات</option><option value="active">نشط</option><option value="expired">منتهي</option><option value="paused">موقوف</option></select><button class="btn" onclick="openMember()">＋ إضافة عضو</button></div><div class="card"><div class="table-wrap"><table><thead><tr><th>رقم</th><th>العضو</th><th>الهاتف</th><th>الباقة</th><th>الانتهاء</th><th>المتبقي</th><th>المستحق</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody id="membersRows">${memberRows(state.members)}</tbody></table></div></div><div class="credit">تصميم <b>مهندس علي أشرف</b></div>`}function memberRows(arr){if(!arr.length)return '<tr><td colspan="9"><div class="empty">لا يوجد أعضاء بعد. ابدأ بإضافة أول عضو.</div></td></tr>';return arr.map(m=>`<tr><td class="orange">${m.number}</td><td>${m.photo?`<img class="member-photo" src="${m.photo}" alt="">`:``}${expiringSoon(m)?'<span title="اشتراكه قرب ينتهي" style="color:#f5c451">⚠</span> ':''}<b>${esc(m.name)}</b></td><td>${esc(m.phone||'—')}</td><td>${esc(m.plan||'—')}</td><td>${fmt(m.endDate)}</td><td>${subscriptionDaysLeft(m)===null?'—':subscriptionDaysLeft(m)<0?'منتهي':subscriptionDaysLeft(m)+' يوم'}</td><td class="${Number(m.balanceDue||0)>0?'red':'green'}">${money(m.balanceDue||0)}</td><td>${statusBadge(m)}</td><td><button class="btn secondary small" onclick="memberHistory('${m.id}')">الملف</button> <button class="btn secondary small" onclick="openMember('${m.id}')">تعديل</button> <button class="btn secondary small" onclick="renewMember('${m.id}')">تجديد</button> <button class="btn secondary small" onclick="openPause('${m.id}')">${m.pauseUntil?'إيقاف مجدول':'إيقاف مؤقت'}</button></td></tr>`).join('')}function filterMembers(){let q=(document.getElementById('memberSearch')?.value||'').toLowerCase(),f=document.getElementById('memberFilter')?.value||'all';let arr=state.members.filter(m=>(m.name+' '+m.number+' '+m.phone).toLowerCase().includes(q));if(f==='active')arr=arr.filter(activeMember);if(f==='expired')arr=arr.filter(m=>!activeMember(m)&&m.status!=='موقوف');if(f==='paused')arr=arr.filter(m=>m.status==='موقوف');document.getElementById('membersRows').innerHTML=memberRows(arr)}

function openMember(id){let m=state.members.find(x=>x.id===id)||{name:'',phone:'',plan:'شهري',fee:500,startDate:dateNow(),endDate:new Date(Date.now()+30*86400000).toISOString().slice(0,10),status:'نشط',notes:'',photo:''};editId=id||null;pendingMemberPhoto=m.photo||'';openModal(id?'تعديل بيانات العضو':'تسجيل عضو جديد',`<form onsubmit="saveMember(event)"><div class="form-grid"><div class="form-group"><label>اسم العضو *</label><input class="field" name="name" required value="${esc(m.name)}"></div><div class="form-group"><label>رقم الهاتف</label><input class="field" name="phone" inputmode="tel" value="${esc(m.phone)}"></div><div class="form-group"><label>صورة العضو</label><input class="field" id="memberPhotoFile" type="file" accept="image/*" onchange="loadMemberPhoto(event)"><div class="photo-preview"><img id="memberPhotoPreview" src="${m.photo||''}" style="${m.photo?'':'display:none'}" alt="معاينة الصورة"><span class="muted smalltext" id="photoHelp">${m.photo?'الصورة الحالية محفوظة':'اختر صورة من جهازك'}</span><button type="button" class="btn secondary small" onclick="clearMemberPhoto()">إزالة الصورة</button></div></div><div class="form-group"><label>نوع الاشتراك</label><select class="field" name="plan">${['يومي','أسبوعي','شهري','3 شهور','6 شهور','سنوي','مخصص'].map(x=>`<option ${m.plan===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-group"><label>قيمة الاشتراك</label><input class="field" id="memberFee" name="fee" type="number" min="0" required value="${Number(m.fee)||0}" oninput="syncPaidDefault()"></div><div class="form-group"><label>تاريخ البداية</label><input class="field" name="startDate" type="date" required onchange="syncEndFromDays()" oninput="syncEndFromDays()" value="${m.startDate||dateNow()}"></div>${id?'':`<div class="form-group"><label>عدد أيام الاشتراك</label><input class="field" id="memberDays" name="days" type="number" min="1" max="3650" placeholder="مثال: 15 أو 20" oninput="syncEndFromDays()"><small class="muted smalltext">اخ function syncPaidDefault(){let fee=document.getElementById('memberFee'),paid=document.getElementById('memberPaid');if(fee&&paid&&!paid.dataset.touched)paid.value=fee.value}document.addEventListener('input',e=>{if(e.target&&e.target.id==='memberPaid')e.target.dataset.touched='1'});
function loadMemberPhoto(e){let file=e.target.files&&e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')){toast('اختر ملف صورة صالحًا');return}if(file.size>12*1024*1024){toast('حجم الصورة كبير؛ اختر صورة أقل من 12 ميجابايت');e.target.value='';return}let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let max=600,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);pendingMemberPhoto=canvas.toDataURL('image/jpeg',0.78);let preview=document.getElementById('memberPhotoPreview');preview.src=pendingMemberPhoto;preview.style.display='block';document.getElementById('photoHelp').textContent='تم تجهيز الصورة وحفظها مع بيانات العضو';};img.onerror=()=>toast('تعذر قراءة الصورة');img.src=reader.result};reader.readAsDataURL(file)}
function clearMemberPhoto(){pendingMemberPhoto='';let f=document.getElementById('memberPhotoFile'),img=document.getElementById('memberPhotoPreview');if(f)f.value='';if(img){img.removeAttribute('src');img.style.display='none'}let h=document.getElementById('photoHelp');if(h)h.textContent='لن يتم حفظ صورة لهذا العضو'}
function syncEndFromDays(){let days=document.getElementById('memberDays'),start=document.querySelector('#modal form input[name=startDate]'),end=document.querySelector('#modal form input[name=endDate]');if(!days||!start||!end)return;let n=Number(days.value);if(n>0&&start.value)end.value=addDaysISO(start.value,n)}function saveMember(e){e.preventDefault();let wasEditing=!!editId;let d=Object.fromEntries(new FormData(e.target).entries());let daysInput=Number(d.days);delete d.days;if(!wasEditing&&daysInput>0){d.endDate=addDaysISO(d.startDate,daysInput)}if(d.endDate<d.startDate){toast('تاريخ الانتهاء يجب ألا يسبق تاريخ البداية');return}let m=state.members.find(x=>x.id===editId);if(m){Object.assign(m,d,{fee:Number(d.fee),photo:pendingMemberPhoto});logAction('تعديل بيانات عضو',m.name);}else{let used=new Set(state.members.map(x=>Number(x.number)));let n=1;while(used.has(n))n++;let paid=Number(d.paidAmount??d.fee)||0;if(paid>Number(d.fee)){toast('المبلغ المدفوع لا يمكن أن يتجاوز قيمة الاشتراك');return}m={id:uid(),number:n,...d,fee:Number(d.fee),photo:pendingMemberPhoto,createdAt:dateNow(),balanceDue:Math.max(0,Number(d.fee)-paid)};delete m.paidAmount;state.members.push(m);if(paid>0)state.payments.push({id:uid(),memberId:m.id,memberName:m.name,date:dateNow(),amount:paid,type:'اشتراك جديد',note:paid>=Number(d.fee)?'تم تحصيل قيمة الاشتراك كاملة عند التسجيل':'دفعة جزئية عند تسجيل العضو'});logAction('إضافة عضو',m.name);}save();closeModal();toast(wasEditing?'تم حفظ بيانات العضو بنجاح':'تم تسجيل العضو وتسجيل دفعة الاشتراك تلقائيًا')}

function renewMember(id){let m=state.members.find(x=>x.id===id);if(!m)return;editId=id;openModal('تجديد الاشتراك',`<form onsubmit="saveRenew(event,'${id}')"><div class="notice">تجديد اشتراك: <b>${esc(m.name)}</b> · تاريخ الانتهاء الحالي: ${fmt(m.endDate)}</div><div class="form-grid"><div class="form-group"><label>الباقة</label><select class="field" name="plan">${['يومي','أسبوعي','شهري','3 شهور','6 شهور','سنوي','مخصص'].map(x=>`<option ${m.plan===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-group"><label>السعر</label><input class="field" name="fee" type="number" min="0" value="${m.fee}" required></div><div class="form-group"><label>بداية الاشتراك الجديد</label><input class="field" name="startDate" type="date" value="${m.endDate>=dateNow()?new Date(new Date(m.endDate+'T12:00:00').getTime()+86400000).toISOString().slice(0,10):dateNow()}" required></div><div class="form-group"><label>تاريخ الانتهاء الجديد</label><input class="field" name="endDate" type="date" value="${new Date(Date.now()+30*86400000).toISOString().slice(0,10)}" required></div><div class="form-group"><label>المبلغ المحصل الآن</label><input class="field" name="paid" type="number" min="0" value="${m.fee}" required></div></div><div class="form-actions"><button class="btn">حفظ التجديد</button><button type="button" class="btn secondary" onclick="closeModal()">إلغاء</button></div></form>`)}function saveRenew(e,id){e.preventDefault();let d=Object.fromEntries(new FormData(e.target).entries()),m=state.members.find(x=>x.id===id);if(d.endDate<d.startDate){toast('راجع تواريخ الاشتراك');return}m.plan=d.plan;m.fee=Number(d.fee);m.startDate=d.startDate;m.endDate=d.endDate;m.status='نشط';let paid=Number(d.paid);if(paid>Number(d.fee)){toast('المبلغ المحصل لا يمكن أن يتجاوز قيمة التجديد');return}m.balanceDue=Math.max(0,Number(d.fee)-paid);if(paid>0)state.payments.push({id:uid(),memberId:id,memberName:m.name,date:dateNow(),amount:paid,type:'تجديد اشتراك',note:'تجديد الاشتراك'});logAction('تجديد اشتراك',`${m.name} — مدفوع ${paid} / ${d.fee}`);save();closeModal();toast('تم تجديد الاشتراك وتسجيل الدفعة')}
function subscriptionsPage(){let exp=expiringMembers(),expired=state.members.filter(m=>!activeMember(m)&&m.status!=='موقوف');return `<h1 class="page-title">إدارة الاشتراكات</h1><p class="page-desc">متابعة حالة الاشتراكات ومواعيد الانتهاء والتجديد.</p><div class="stats">${stat('نشطة',state.members.filter(activeMember).length,'✓','اشتراك ساري')}${stat('قريبة الانتهاء',exp.length,'⌛',`خلال ${state.settings.alertDays} أيام`)}${stat('منتهية',expired.length,'!', 'تحتاج إلى تجديد')}${stat('إجمالي الأعضاء',state.members.length,'♙','في النظام')}</div><div class="card"><div class="card-head"><h3>الاشتراكات التي تحتاج إلى متابعة</h3><button class="btn secondary small" onclick="exportCSV('members')">تصدير Excel/CSV</button></div><div class="table-wrap"><table><thead><tr><th>رقم</th><th>الاسم</th><th>الباقة</th><th>البداية</th><th>الانتهاء</th><th>الحالة</th><th></th></tr></thead><tbody>${[...exp,...expired].length?[...exp,...expired].map(m=>`<tr><td>${m.number}</td><td>${esc(m.name)}</td><td>${esc(m.plan)}</td><td>${fmt(m.startDate)}</td><td>${fmt(m.endDate)}</td><td>${statusBadge(m)}</td><td><button class="btn small" onclick="renewMember('${m.id}')">تجديد</button> <button class="btn secondary small" onclick="openPause('${m.id}')">إيقاف مؤقت</button></td></tr>`).join(''):'<tr><td colspan="7"><div class="empty">لا توجد اشتراكات تحتاج متابعة حاليًا.</div></td></tr>'}</tbody></table></div></div><div class="credit">تصميم <b>مهندس علي أشرف</b></div>`}
function attendancePage(){return `<h1 class="page-title">الحضور والانصراف</h1><p class="page-desc">سجّل حضور العضو بالبحث أو باستخدام قارئ باركود USB.</p><div class="notice">لقارئ USB الذي يعمل كلوحة مفاتيح: اضغط داخل الحقل، ثم امسح الكارت. إذا أرسل القارئ Enter تلقائيًا فسيتم تسجيل الحضور مباشرة. يلزم ضبط القارئ على وضع Keyboard/HID.</div><div class="card"><div class="card-head"><h3>⌁ تسجيل حضور سريع</h3><span class="badge">محلي</span></div><form class="scanner-box" onsubmit="scanAttendance(event)"><span style="font-size:22px">▦</span><input id="scanInput" class="field" autofocus placeholder="امسح الباركود أو اكتب رقم العضو / الاسم"><button class="btn">تسجيل الحضور</button></form><div id="scanResult" style="margin-top:14px"></div></div><div class="card"><div class="card-head"><h3>سجل حضور اليوم</h3><span class="muted smalltext">${fmt(dateNow())}</span></div><div class="table-wrap"><table><thead><tr><th>الوقت</th><th>العضو</th><th>رقم العضوية</th><th>النتيجة</th></tr></thead><tbody>${attendanceRows()}</tbody></table></div></div><div class="credit">تصميم <b>مهندس علي أشرف</b></div>`}function attendanceRows(){let a=state.attendance.filter(x=>x.date===dateNow()).slice().reverse();return a.length?a.map(x=>`<tr><td>${esc(x.time)}</td><td>${esc(x.name)}</td><td>${esc(x.number)}</td><td>${x.ok?'<span class="badge">تم التسجيل</span>':'<span class="badge expired">اشتراك غير نشط</span>'}</td></tr>`).join(''):'<tr><td colspan="4"><div class="empty">لم يتم تسجيل حضور اليوم.</div></td></tr>'}function addDaysISO(date,days){let d=new Date((date||dateNow())+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+Number(days||0));return d.toISOString().slice(0,10)}
function resumePausedMember(m){if(!m||!m.pauseUntil||dateNow()<=m.pauseUntil)return false;let days=Math.max(1,Number(m.pauseDays)||1);m.endDate=addDaysISO(m.endDate,days);m.status='نشط';logAction('استئناف تلقائي للاشتراك',`${m.name}: تمديد ${days} يومًا حتى ${m.endDate}`);m.pauseStart='';m.pauseUntil='';m.pauseDays=0;try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}return true}
function subscriptionDaysLeft(m){if(!m.endDate)return null;let today=new Date(dateNow()+'T00:00:00Z'),end=new Date(m.endDate+'T00:00:00Z');return Math.ceil((end-today)/86400000)}function playWhistle(){try{let AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;let c=new AC(),t=c.currentTime;[[0,2300,2900],[0.22,2500,3100]].forEach(([d,f1,f2])=>{let o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.setValueAtTime(f1,t+d);o.frequency.exponentialRampToValueAtTime(f2,t+d+0.18);g.gain.setValueAtTime(0.0001,t+d);g.gain.exponentialRampToValueAtTime(1,t+d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.2);o.connect(g);g.connect(c.destination);o.start(t+d);o.stop(t+d+0.22)});setTimeout(()=>c.close(),1000)}catch(e){}}function playDenied(){try{let AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;let c=new AC(),t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.setValueAtTime(220,t);g.gain.setValueAtTime(0.2,t);g.gain.setValueAtTime(0,t+0.25);g.gain.setValueAtTime(0.2,t+0.35);g.gain.setValueAtTime(0,t+0.6);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+0.7);setTimeout(()=>c.close(),1000)}catch(e){}}function speakSeq(parts){try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();let voices=speechSynthesis.getVoices();parts.forEach(pt=>{let u=new SpeechSynthesisUtterance(pt.t);u.lang=pt.l;let v=voices.find(x=>x.lang&&x.lang.toLowerCase().startsWith(pt.l.slice(0,2).toLowerCase()));if(v)u.voice=v;u.rate=pt.l.startsWith('ar')?1:0.95;u.volume=1;speechSynthesis.speak(u)})}catch(e){}}function isArabicText(t){return /[\u0600-\u06FF]/.test(String(t||''))}function expiringSoon(m){return expiringMembers().some(x=>x.id===m.id)}function announceAttendance(ok,m,days){if(ok){playWhistle();let parts=[{t:'تم التسجيل',l:'ar-EG'},{t:m.name,l:isArabicText(m.name)?'ar-EG':'en-US'}];if(days!==null){if(days<0)parts.push({t:'انتهى الاشتراك',l:'ar-EG'});else if(days===0)parts.push({t:'الاشتراك ينتهي اليوم',l:'ar-EG'});else parts.push({t:'باقي '+days+' '+(days===1?'يوم':'أيام'),l:'ar-EG'})}if(Number(m.balanceDue)>0)parts.push({t:'عليه مستحق '+Math.round(m.balanceDue)+' جنيه',l:'ar-EG'});setTimeout(()=>speakSeq(parts),650)}else{playDenied();setTimeout(()=>speakSeq([{t:'الاشتراك غير نشط',l:'ar-EG'},{t:m.name,l:isArabicText(m.name)?'ar-EG':'en-US'}]),700)}}function speakArabic(text){try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='ar-EG';let v=speechSynthesis.getVoices().find(x=>/^ar/i.test(x.lang));if(v)u.voice=v;u.rate=1;speechSynthesis.speak(u)}catch(e){}}function scanAttendance(e){e.preventDefault();let q=document.getElementById('scanInput').value.trim();if(!q)return;let m=state.members.find(x=>String(x.number)===q||x.barcode===q||x.name.toLowerCase()===q.toLowerCase());let box=document.getElementById('scanResult');if(!m){box.innerHTML='<div class="notice">لم يتم العثور على عضو مطابق. تأكد من الرقم أو سجّل العضو أولًا.</div>';return}let already=state.attendance.some(x=>x.memberId===m.id&&x.date===dateNow()&&x.ok);if(already){box.innerHTML=`<div class="notice" style="border-color:#8a6a2c">⚠ تم تسجيل حضور <b>${esc(m.name)}</b> اليوم بالفعل. لن يتم تكرار التسجيل.</div>`;document.getElementById('scanInput').value='';document.getElementById('scanInput').focus();return}let ok=activeMember(m),days=subscriptionDaysLeft(m),now=new Date();state.attendance.push({id:uid(),memberId:m.id,name:m.name,number:m.number,date:dateNow(),time:now.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}),ok,daysRemaining:days});logAction('تسجيل حضور',`${m.name} — ${ok?'مقبول':'اشتراك غير نشط'}`);save();let remaining=days===null?'تاريخ الانتهاء غير محدد':days<0?'انتهى الاشتراك منذ '+Math.abs(days)+' يوم':days===0?'الاشتراك ينتهي اليوم':`متبقي ${days} ${days===1?'يوم':'أيام'} على انتهاء الاشتراك`;box=document.getElementById('scanResult');box.innerHTML=`<div class="notice" style="border-color:${ok?'#2e7657':'#7b3a3a'};color:${ok?'#9af0c5':'#ff9aa1'}">${ok?'✓ تم تسجيل الحضور بنجاح':'⚠ الاشتراك غير نشط — تم تسجيل محاولة الحضور'}<br><div style="display:flex;align-items:center;gap:12px;margin:6px 0">${m.photo?`<img src="${m.photo}" alt="" style="width:62px;height:62px;border-radius:12px;object-fit:cover">`:''}<div>${expiringSoon(m)?'<span style="color:#f5c451;font-size:20px" title="اشتراكه قرب ينتهي">⚠</span> ':''}<b style="font-size:22px">${esc(m.name)}</b><div class="smalltext">العضوية رقم ${m.number}</div></div></div><br>حالة الاشتراك: ${ok?'نشط':(m.pauseUntil&&dateNow()<=m.pauseUntil?'موقوف مؤقتًا':'منتهي أو موقوف')} · الانتهاء: ${fmt(m.endDate)}<br><strong style="display:inline-block;margin-top:8px;font-size:15px;color:${days!==null&&days<=3?'#ff9299':'inherit'}">⏳ ${remaining}</strong>${Number(m.balanceDue)>0?`<br><strong style="display:inline-block;margin-top:8px;font-size:15px;color:#ffbd83">💰 عليه مستحق: ${money(m.balanceDue)}</strong>`:''}</div>`;document.getElementById('scanInput').value='';document.getElementById('scanInput').focus();announceAttendance(ok,m,days);toast(ok?'تم تسجيل الحضور':'تنبيه: الاشتراك غير نشط')}
function debtPayForm(m){if(!(Number(m.balanceDue)>0))return '<div class="notice">لا توجد ديون مستحقة على هذا المشترك.</div>';return `<form class="debt-form" onsubmit="saveDebtPayment(event,'${m.id}')" style="margin:12px 0;padding:14px;border:1px solid #ddd;border-radius:10px"><h3 style="margin:0 0 10px">تسديد الديون</h3><div class="form-grid"><div class="form-group"><label>مبلغ التسديد *</label><input class="field" name="amount" type="number" min="0.01" step="0.01" required value="${Number(m.balanceDue)}"><small class="muted smalltext">المستحق الحالي: ${money(m.balanceDue)}</small></div><div class="form-group"><label>تاريخ التسديد</label><input class="field" name="date" type="date" value="${dateNow()}" required></div><div class="form-group" style="grid-column:1/-1"><label>ملاحظات</label><input class="field" name="note" placeholder="مثال: تسديد جزء من المتأخرات"></div></div><div class="form-actions"><button class="btn">تسديد وتسجيل في الخزنة</button></div></form>`}
function saveDebtPayment(e,id){e.preventDefault();let m=state.members.find(x=>x.id===id);if(!m)return;let d=Object.fromEntries(new FormData(e.target).entries());let amount=Number(d.amount);let due=Number(m.balanceDue||0);if(!Number.isFinite(amount)||amount<=0){toast('أدخل مبلغًا صحيحًا أكبر من صفر');return}m.balanceDue=Math.max(0,Math.round((due-amount)*100)/100);let payment={id:uid(),memberId:m.id,memberName:m.name,date:d.date||dateNow(),amount:amount,type:'تسديد ديون',note:d.note||'تسديد دين سابق'};state.payments.push(payment);logAction('تسديد ديون',`${m.name} — ${money(amount)} — المتبقي ${money(m.balanceDue)}`);save();memberHistory(id);toast('تم تسديد المبلغ وتسجيله في الخزنة');receipt(payment)}
function memberHistory(id){let m=state.members.find(x=>x.id===id);if(!m)return;let pays=state.payments.filter(p=>p.memberId===id),att=state.attendance.filter(a=>a.memberId===id);openModal('ملف المشترك وسجل الحساب',`<div class="notice"><b>${esc(m.name)}</b> — رقم العضوية ${m.number}<br>الاشتراك: ${esc(m.plan||'—')}<br>تاريخ الانتهاء: ${fmt(m.endDate)}<br>الأيام المتبقية: ${subscriptionDaysLeft(m)<0?'منتهي منذ '+Math.abs(subscriptionDaysLeft(m))+' يوم':subscriptionDaysLeft(m)+' يوم'}<br>المبلغ المستحق: <b>${money(m.balanceDue||0)}</b></div>${debtPayForm(m)}<div class="toolbar"><button class="btn" onclick="openPaymentForMember('${m.id}')">تسجيل دفعة لهذا المشترك</button><button class="btn secondary" onclick="printMemberStatement('${m.id}')">طباعة كشف الحساب</button></div><h3>سجل المدفوعات</h3><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>البيان</th><th>المبلغ</th></tr></thead><tbody>${pays.length?pays.slice().reverse().map(p=>`<tr><td>${fmt(p.date)}</td><td>${esc(p.type||'دفعة')}</td><td>${money(p.amount)}</td></tr>`).join(''):'<tr><td colspan="3">لا توجد دفعات مسجلة</td></tr>'}</tbody></table></div><h3 style="margin-top:20px">سجل الحضور</h3><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>الوقت</th><th>النتيجة</th></tr></thead><tbody>${att.length?att.slice().reverse().slice(0,30).map(a=>`<tr><td>${fmt(a.date)}</td><td>${esc(a.time)}</td><td>${a.ok?'حضور مقبول':'اشتراك غير نشط'}</td></tr>`).join(''):'<tr><td colspan="3">لا يوجد سجل حضور</td></tr>'}</tbody></table></div>`)}function openPaymentForMember(id){closeModal();openPayment();setTimeout(()=>{let x=document.querySelector('#modal form select[name=memberId]');if(x)x.value=id},50)}function printMemberStatement(id){let m=state.members.find(x=>x.id===id);if(!m)return;let pays=state.payments.filter(p=>p.memberId===id);let w=window.open('','_blank','width=650,height=700');if(!w){toast('اسمح بالنوافذ المنبثقة لطباعة كشف الحساب');return}w.document.write(`<html lang="ar" dir="rtl"><meta charset="utf-8"><title>كشف حساب</title><body style="font-family:Tahoma;padding:25px"><h2>FORCE GYM — كشف حساب مشترك</h2><p>الاسم: ${esc(m.name)} | رقم العضوية: ${m.number}</p><p>المستحق الحالي: ${money(m.balanceDue||0)}</p><table border="1" cellpadding="8" cellspacing="0" width="100%"><tr><th>التاريخ</th><th>البيان</th><th>المبلغ</th></tr>${pays.map(p=>`<tr><td>${fmt(p.date)}</td><td>${esc(p.type||'دفعة')}</td><td>${money(p.amount)}</td></tr>`).join('')}</table><p>تصميم مهندس علي أشرف</p><script>setTimeout(()=>print(),300)<\/script></body></html>`);w.document.close()}
function openPayment(){let opts=state.members.map(m=>`<option value="${m.id}">${esc(m.name)} — #${m.number}</option>`).join('');openModal('تسجيل دفعة مالية',`<form onsubmit="savePayment(event)"><div class="form-grid"><div class="form-group"><label>العضو</label><select class="field" name="memberId"><option value="">دفعة عامة / أخرى</option>${opts}</select></div><div class="form-group"><label>المبلغ *</label><input class="field" name="amount" type="number" min="0.01" step="0.01" required></div><div class="form-group"><label>التاريخ</label><input class="field" name="date" type="date" value="${dateNow()}" required></div><div class="form-group"><label>نوع الدفعة</label><select class="field" name="type"><option>اشتراك</option><option>تجديد اشتراك</option><option>منتجات</option><option>إيراد آخر</option></select></div><div class="form-group" style="grid-column:1/-1"><label>ملاحظات</label><input class="field" name="note"></div></div><div class="form-actions"><button class="btn">حفظ الدفعة</button></div></form>`)}function savePayment(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target).entries()),m=state.members.find(x=>x.id===d.memberId);d.amount=Number(d.amount);if(!Number.isFinite(d.amount)||d.amount<=0){toast('أدخل مبلغًا صحيحًا أكبر من صفر');return}if(d.memberId&&!m){toast('العضو المحدد غير موجود');return}if(m&&d.type!=='إيراد آخر'&&d.type!=='منتجات'){m.balanceDue=Math.max(0,Number(m.balanceDue||0)-d.amount)}let payment={id:uid(),...d,amount:Number(d.amount),memberName:m?.name||'إيراد عام'};state.payments.push(payment);logAction('تسجيل دفعة',`${payment.memberName} — ${money(payment.amount)}`);save();closeModal();toast('تم تسجيل الدفعة');receipt(payment)}function receipt(p){let w=window.open('','_blank','width=480,height=650');if(!w){toast('تم الحفظ. اسمح بالنوافذ المنبثقة لطباعة الإيصال.');return}w.document.write(`<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>إيصال FORCE</title><style>body{font-family:Tahoma,Arial;padding:28px;color:#222}h1{text-align:center}hr{border:0;border-top:1px solid #aaa}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed #ccc}.print{text-align:center;margin-top:25px}@media print{.print{display:none}}</style></head><body><h1>FORCE GYM</h1><p style="text-align:center">إيصال استلام دفعة</p><hr><div class="row"><span>رقم الإيصال</span><b>${esc(p.id)}</b></div><div class="row"><span>التاريخ</span><b>${fmt(p.date)}</b></div><div class="row"><span>الاسم</span><b>${esc(p.memberName)}</b></div><div class="row"><span>البيان</span><b>${esc(p.type||'دفعة')}</b></div><div class="row"><span>المبلغ</span><b>${money(p.amount)}</b></div><p>ملاحظات: ${esc(p.note||'—')}</p><p style="text-align:center;margin-top:40px">شكرًا لزيارتكم — FORCE</p><div class="print"><button onclick="print()">طباعة الإيصال</button></div><script>setTimeout(()=>print(),300)<\/script></body></html>`);w.document.close()}
function openExpense(){openModal('تسجيل مصروف',`<form onsubmit="saveExpense(event)"><div class="form-grid"><div class="form-group"><label>بند المصروف *</label><select class="field" name="category"><option>إيجار</option><option>كهرباء ومياه</option><option>رواتب</option><option>صيانة أجهزة</option><option>معدات</option><option>نظافة</option><option>مصروفات أخرى</option></select></div><div class="form-group"><label>المبلغ *</label><input class="field" name="amount" type="number" min="0.01" step="0.01" required></div><div class="form-group"><label>التاريخ</label><input class="field" name="date" type="date" value="${dateNow()}" required></div><div class="form-group"><label>ملاحظات</label><input class="field" name="note"></div></div><div class="form-actions"><button class="btn">حفظ المصروف</button></div></form>`)}function saveExpense(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target).entries());d.amount=Number(d.amount);if(!Number.isFinite(d.amount)||d.amount<=0){toast('أدخل مبلغًا صحيحًا أكبر من صفر');return}state.expenses.push({id:uid(),...d,amount:Number(d.amount)});logAction('تسجيل مصروف',`${d.category} — ${money(d.amount)}`);save();closeModal();toast('تم تسجيل المصروف')}
function treasuryPage(){let total=state.payments.reduce((a,p)=>a+Number(p.amount),0),expenses=state.expenses.reduce((a,p)=>a+Number(p.amount),0);return `<h1 class="page-title">الخزنة والإدارة المالية</h1><p class="page-desc">تابع المدفوعات والمصروفات وحركة الأموال المسجلة.</p><div class="stats">${stat('إيرادات اليوم',treasuryLocked()?'🔒':money(todayRevenue()),'↗','المدفوعات اليوم')}${stat('إيرادات الشهر',treasuryLocked()?'🔒':money(monthRevenue()),'◈','المحصل هذا الشهر')}${stat('مصروفات الشهر',money(monthExpenses()),'↘','المصروفات المسجلة')}${stat('صافي الحركة الكلية',money(total-expenses),'＝','الإيرادات ناقص المصروفات')}${stat('ديون المشتركين',money(state.members.reduce((a,m)=>a+Number(m.balanceDue||0),0)),'!','مستحقات غير محصلة')}</div><div class="toolbar"><button class="btn" onclick="openPayment()">＋ تسجيل دفعة</button><button class="btn secondary" onclick="openExpense()">＋ تسجيل مصروف</button><button class="btn secondary" onclick="exportCSV('finance')">تصدير CSV</button></div><div class="grid2"><div class="card"><div class="card-head"><h3>آخر المدفوعات</h3><span class="green">${money(total)}</span></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>البيان</th><th>العضو</th><th>المبلغ</th></tr></thead><tbody>${state.payments.length?state.payments.slice().reverse().map(p=>`<tr><td>${fmt(p.date)}</td><td>${esc(p.type)}</td><td>${esc(p.memberName)}</td><td class="green">${money(p.amount)}</td></tr>`).join(''):'<tr><td colspan="4"><div class="empty">لا توجد دفعات.</div></td></tr>'}</tbody></table></div></div><div class="card"><div class="card-head"><h3>آخر المصروفات</h3><span class="red">${money(expenses)}</span></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>البند</th><th>ملاحظات</th><th>المبلغ</th></tr></thead><tbody>${state.expenses.length?state.expenses.slice().reverse().map(p=>`<tr><td>${fmt(p.date)}</td><td>${esc(p.category)}</td><td>${esc(p.note||'—')}</td><td class="red">${money(p.amount)}</td></tr>`).join(''):'<tr><td colspan="4"><div class="empty">لا توجد مصروفات.</div></td></tr>'}</tbody></table></div></div></div><div class="notice">صافي الحركة هنا محسوب من العمليات المسجلة داخل النظام فقط؛ لا يمثل بالضرورة رصيد الخزنة الفعلي أو الربح المحاسبي النهائي.</div><div class="credit">تصميم <b>مهندس علي أشرف</b></div>`}
function trainersPage(){return `<h1 class="page-title">إدارة المدربين</h1><p class="page-desc">إدارة بيانات المدربين ومعلومات التواصل والراتب.</p><div class="toolbar"><button class="btn" onclick="openTrainer()">＋ إضافة مدرب</button></div><div class="card"><div class="table-wrap"><table><thead><tr><th>الاسم</th><th>الهاتف</th><th>التخصص</th><th>الراتب</th><th>إجراء</th></tr></thead><tbody>${state.trainers.length?state.trainers.map(t=>`<tr><td><b>${esc(t.name)}</b></td><td>${esc(t.phone||'—')}</td><td>${esc(t.specialty||'—')}</td><td>${money(t.salary)}</td><td><button class="btn secondary small" onclick="openTrainer('${t.id}')">تعديل</button></td></tr>`).join(''):'<tr><td colspan="5"><div class="empty">لم تتم إضافة مدربين بعد.</div></td></tr>'}</tbody></table></div></div><div class="credit">تصميم <b>مهندس علي أشرف</b></div>`}function openTrainer(id){let t=state.trainers.find(x=>x.id===id)||{name:'',phone:'',specialty:'',salary:0};editId=id||null;openModal(id?'تعديل بيانات المدرب':'إضافة مدرب',`<form onsubmit="saveTrainer(event)"><div class="form-grid"><div class="form-group"><label>اسم المدرب *</label><input class="field" name="name" required value="${esc(t.name)}"></div><div class="form-group"><label>رقم الهاتف</label><input class="field" name="phone" value="${esc(t.phone)}"></div><div class="form-group"><label>التخصص</label><input class="field" name="specialty" value="${esc(t.specialty)}"></div><div class="form-group"><label>الراتب الشهري</label><input class="field" name="salary" type="number" min="0" value="${Number(t.salary)||0}"></div></div><div class="form-actions"><button class="btn">حفظ</button>${id?`<button type="button" class="btn danger" onclick="deleteTrainer('${id}')">حذف</button>`:''}</div></form>`)}function saveTrainer(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target).entries()),t=state.trainers.find(x=>x.id===editId);if(t)Object.assign(t,d,{salary:Number(d.salary)});else state.trainers.push({id:uid(),...d,salary:Number(d.salary)});save();closeModal();toast('تم حفظ بيانات المدرب')}function deleteTrainer(id){if(!confirm('حذف بيانات المدرب؟'))return;state.trainers=state.trainers.filter(x=>x.id!==id);save();closeModal()}
function monthlyPage(){let month=(document.getElementById('monthPick')||{}).value||dateNow().slice(0,7);let inc=state.payments.filter(x=>(x.date||'').startsWith(month)).reduce((a,x)=>a+Number(x.amount||0),0),out=state.expenses.filter(x=>(x.date||'').startsWith(month)).reduce((a,x)=>a+Number(x.amount||0),0),net=inc-out;let months=[];for(let i=11;i>=0;i--){let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);let k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');let ri=state.payments.filter(x=>(x.date||'').startsWith(k)).reduce((a,x)=>a+Number(x.amount||0),0),re=state.expenses.filter(x=>(x.date||'').startsWith(k)).reduce((a,x)=>a+Number(x.amount||0),0);months.push({k,ri,re,net:ri-re})}return `<h1 class="page-title">الأداء المالي الشهري</h1><p class="page-desc">اعرف إجمالي الإيرادات والمصروفات وصافي الحركة لكل شهر حسب العمليات المسجلة.</p><div class="card"><div class="toolbar"><label class="muted smalltext" for="monthPick">اختار الشهر:</label><input id="monthPick" class="field" type="month" value="${esc(month)}" onchange="updateMonthlyReport(this.value)"><button class="btn secondary" onclick="exportMonthly('${esc(month)}')">تصدير تقرير الشهر CSV</button></div><div class="stats" id="monthlyStats">${stat('إجمالي الإيرادات',money(inc),'↗','كل الدفعات خلال الشهر')}${stat('إجمالي المصروفات',money(out),'↘','كل المصروفات خلال الشهر')}${stat('صافي الشهر',money(net),net>=0?'＝':'↘',net>=0?'إيرادات ناقص مصروفات':'المصروفات أعلى من الإيرادات')}${stat('عدد الدفعات',state.payments.filter(x=>(x.date||'').startsWith(month)).length,'▤','عمليات الإيراد')}</div><div class="notice">صافي الشهر = الدفعات المسجلة خلال الشهر − المصروفات المسجلة خلال الشهر. دقة النتيجة تعتمد على إدخال كل الإيرادات والمصروفات بتاريخها الصحيح، ولا تشمل عمليات لم تُسجّل.</div></div><div class="card"><div class="card-head"><h3>ملخص آخر 12 شهرًا</h3></div><div class="table-wrap"><table><thead><tr><th>الشهر</th><th>الإيرادات</th><th>المصروفات</th><th>الصافي</th></tr></thead><tbody>${months.slice().reverse().map(x=>`<tr><td>${x.k}</td><td class="green">${money(x.ri)}</td><td class="red">${money(x.re)}</td><td class="${x.net>=0?'green':'red'}">${money(x.net)}</td></tr>`).join('')}</tbody></table></div></div><div class="credit">تصميم <b>مهندس علي أشرف</b></div>`}function updateMonthlyReport(v){render();let el=document.getElementById('monthPick');if(el)el.value=v}function exportMonthly(month){let rows=[['الشهر','النوع','التاريخ','البيان','المبلغ'],...state.payments.filter(x=>(x.date||'').startsWith(month)).map(x=>[month,'إيراد',x.date,x.type||'دفعة اشتراك',x.amount]),...state.expenses.filter(x=>(x.date||'').startsWith(month)).map(x=>[month,'مصروف',x.date,x.category,x.amount])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='FORCE-month-'+month+'.csv';a.click();URL.revokeObjectURL(a.href)}function reportsPage(){let total=state.payments.reduce((a,p)=>a+Number(p.amount),0),exp=state.expenses.reduce((a,p)=>a+Number(p.amount),0);return `<h1 class="page-title">التقارير والإحصائيات</h1><p class="page-desc">ملخصات تشغيلية ومالية قابلة للتصدير.</p><div class="stats">${stat('إجمالي الأعضاء',state.members.length,'♙','جميع السجلات')}${stat('اشتراكات نشطة',state.members.filter(activeMember).length,'✓','حالة الاشتراك سارية')}${stat('إجمالي المدفوعات',money(total),'↗','كل الدفعات المسجلة')}${stat('إجمالي المصروفات',money(exp),'↘','كل المصروفات المسجلة')}</div><div class="card"><div class="card-head"><h3>تصدير التقارير</h3></div><p class="muted smalltext">تنزيل ملفات CSV تفتح في Excel. يمكنك تصدير الأعضاء أو الحضور أو المدفوعات والمصروفات.</p><div class="toolbar"><button class="btn" onclick="exportCSV('members')">تقرير الأعضاء</button><button class="btn secondary" onclick="exportCSV('attendance')">تقرير الحضور</button><button class="btn secondary" onclick="exportCSV('finance')">التقرير المالي</button><button class="btn secondary" onclick="backup()">نسخة احتياطية JSON</button><button class="btn secondary" onclick="exportCSV('audit')">سجل العمليات</button></div></div><div class="card"><div class="card-head"><h3>ملخص الاشتراكات</h3></div><div class="kpi-line"><span>الاشتراكات النشطة</span><strong class="green">${state.members.filter(activeMember).length}</strong></div><div class="kpi-line"><span>الاشتراكات المنتهية</span><strong class="red">${state.members.filter(m=>!activeMember(m)&&m.status!=='موقوف').length}</strong></div><div class="kpi-line"><span>الاشتراكات الموقوفة</span><strong class="orange">${state.members.filter(m=>m.status==='موقوف').length}</strong></div><div class="kpi-line"><span>اشتراكات قاربت على الانتهاء</span><strong>${expiringMembers().length}</strong></div></div><div class="credit">تصميم <b>مهندس علي أشرف</b></div>`}
function settingsPage(){return `<h1 class="page-title">الإعدادات</h1><p class="page-desc">خصص بيانات الجيم والتنبيهات واحتفظ بنسخة آمنة من بياناتك.</p><div class="card"><div class="card-head"><h3>⚙️ إعدادات النظام</h3></div><form onsubmit="saveSettings(event)"><div class="form-grid"><div class="form-group"><label>اسم الجيم</label><input class="field" name="gymName" value="${esc(state.settings.gymName||'FORCE GYM')}" required></div><div class="form-group"><label>العملة</label><select class="field" name="currency"><option ${state.settings.currency==='جنيه'?'selected':''}>جنيه</option><option ${state.settings.currency==='ريال'?'selected':''}>ريال</option><option ${state.settings.currency==='دولار'?'selected':''}>دولار</option></select></div><div class="form-group"><label>التنبيه قبل انتهاء الاشتراك (أيام)</label><input class="field" name="alertDays" type="number" min="1" max="60" value="${Number(state.settings.alertDays)||7}"></div><div class="form-group"><label>رمز البرنامج / كود التفعيل</label><input class="field" name="programCode" value="${esc(state.settings.programCode||'')}" placeholder="اكتب رمز البرنامج هنا" autocomplete="off"><small class="muted smalltext">يُحفظ كإعداد داخل هذا المتصفح؛ لا يُعد نظام تفعيل أو حماية أمنيًا بحد ذاته.</small></div></div><div class="form-group"><label>رمز الخزنة</label><input class="field" name="treasuryPin" type="password" inputmode="numeric" minlength="4" placeholder="اتركه فارغًا لإلغاء رمز الخزنة" value="${esc(state.settings.treasuryPin||'')}" autocomplete="new-password"><small class="muted smalltext">يحمي الخزنة والأداء الشهري والتقارير والإيرادات ونسخ البيانات المالية. لا يظهر لأي شخص غير من يعرف الرمز.</small></div><div class="form-group"><label>رمز تسجيل الدخول (PIN)</label><input class="field" name="loginPin" type="password" inputmode="numeric" minlength="4" placeholder="اتركه فارغًا لإلغاء رمز الدخول" value="${esc(state.settings.loginPin||'')}" autocomplete="new-password"><small class="muted smalltext">استخدم 4 أرقام أو أكثر. هذا قفل محلي داخل المتصفح وليس حماية قوية ضد شخص لديه وصول لملفات الجهاز.</small></div><div class="form-actions"><button class="btn">حفظ الإعدادات</button></div></form></div><div class="card"><div class="card-head"><h3>🔐 خلفية صفحة تسجيل الدخول</h3></div><img class="background-preview" src="${state.settings.loginBackground||'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="600" height="160"><rect width="100%" height="100%" fill="%2315191f"/><text x="50%" y="50%" font-size="22" text-anchor="middle" dominant-baseline="middle" fill="%239aa4af">خلفية تسجيل الدخول</text></svg>')}" alt="معاينة خلفية الدخول"><div class="toolbar" style="margin-top:10px"><label class="btn secondary" for="loginBackgroundFile">اختيار صورة خلفية الدخول</label><input id="loginBackgroundFile" type="file" accept="image/*" hidden onchange="saveCustomImage(event,'loginBackground')"><button class="btn secondary small" type="button" onclick="resetCustomImage('loginBackground')">استعادة الخلفية الافتراضية</button></div><p class="muted smalltext">تظهر الصورة في صفحة تسجيل الدخول قبل فتح النظام.</p></div><div class="card"><div class="card-head"><h3>🎨 هوية التطبيق والخلفية</h3></div><div class="form-grid"><div class="form-group"><label>رمز التطبيق / الشعار</label><div class="toolbar"><img class="app-icon-preview" src="${state.settings.appIcon||'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%23ff7a1a"/><text x="32" y="45" font-size="44" font-weight="bold" text-anchor="middle" fill="%2317100a">F</text></svg>')}" alt="معاينة الرمز"><label class="btn secondary" for="appIconFile">اختيار صورة</label><input id="appIconFile" type="file" accept="image/*" hidden onchange="saveCustomImage(event,'appIcon')"></div><small class="muted smalltext">تظهر في علامة FORCE داخل البرنامج وأيقونة تبويب المتصفح.</small><div><button class="btn secondary small" type="button" onclick="resetCustomImage('appIcon')">استعادة الرمز الافتراضي</button></div></div><div class="form-group"><label>خلفية الشاشة الرئيسية</label><img class="background-preview" src="${state.settings.homeBackground||'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="600" height="160"><rect width="100%" height="100%" fill="%2315191f"/><text x="50%" y="50%" font-size="22" text-anchor="middle" dominant-baseline="middle" fill="%239aa4af">معاينة الخلفية</text></svg>')}" alt="معاينة الخلفية"><div class="toolbar" style="margin-top:10px"><label class="btn secondary" for="homeBackgroundFile">رفع خلفية</label><input id="homeBackgroundFile" type="file" accept="image/*" hidden onchange="saveCustomImage(event,'homeBackground')"><button class="btn secondary small" type="button" onclick="resetCustomImage('homeBackground')">استعادة الخلفية</button></div><small class="muted smalltext">تُعرض الخلفية في لوحة التحكم مع طبقة داكنة للحفاظ على وضوح المحتوى.</small></div></div><div class="notice">تُحفظ الصور محليًا في هذا المتصفح. استخدم صورًا معتدلة الحجم؛ يتم تصغيرها تلقائيًا لتقليل مساحة التخزين.</div></div><div class="card"><div class="card-head"><h3>💾 النسخ الاحتياطي</h3></div><p class="muted smalltext">احفظ نسخة من بياناتك بشكل دوري. ملف النسخة الاحتياطية يحتوي على بيانات الأعضاء والحضور والمدفوعات والإعدادات.</p><div class="toolbar"><button class="btn" onclick="backup()">تنزيل نسخة احتياطية</button><label class="btn secondary" for="restoreFile">استعادة نسخة JSON</label><input id="restoreFile" type="file" accept="application/json,.json" style="display:none" onchange="restoreBackup(event)"></div><div class="notice">هذه النسخة التجريبية تحفظ البيانات على المتصفح والجهاز الحالي فقط. لا تمسح بيانات المتصفح قبل إنشاء نسخة احتياطية، ولا تستخدمها كقاعدة بيانات مشتركة بين عدة أجهزة دون تطوير بنية تخزين ومصادقة مناسبة.</div></div><div class="card"><div class="card-head"><h3>حول النظام</h3><span class="badge warning">نسخة أولية</span></div><div class="kpi-line"><span>اسم النظام</span><strong>FORCE Gym Management System</strong></div><div class="kpi-line"><span>التصميم والتطوير</span><strong class="orange">مهندس علي أشرف</strong></div><div class="kpi-line"><span>التخزين</span><strong>LocalStorage — هذا المتصفح</strong></div></div><div class="credit">تصميم <b>مهندس علي أشرف</b></div>`}function saveSettings(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target).entries());d.alertDays=Number(d.alertDays);d.loginPin=String(d.loginPin||'').trim();if(d.loginPin&&d.loginPin.length<4){alert('رمز الدخول يجب أن يكون 4 أرقام أو أكثر.');return}d.treasuryPin=String(d.treasuryPin||'').trim();if(d.treasuryPin&&d.treasuryPin.length<4){alert('رمز الخزنة يجب أن يكون 4 أرقام أو أكثر.');return}state.settings={...state.settings,...d};save();toast('تم حفظ الإعدادات؛ سيُطلب رمز الدخول عند فتح البرنامج مرة أخرى')}
function exportCSV(type){if((type==='finance'||type==='audit')&&treasuryLocked()){requireTreasury(()=>exportCSV(type));return}let rows=[],name='FORCE-report';if(type==='audit'){name='FORCE-audit-log';rows=[['التاريخ','الوقت','العملية','التفاصيل'],...(state.auditLog||[]).map(x=>[x.date,x.time,x.action,x.details])]}else if(type==='members'){name='FORCE-members';rows=[['رقم العضوية','الاسم','الهاتف','الباقة','السعر','بداية الاشتراك','نهاية الاشتراك','الحالة','المبلغ المستحق','الباركود','ملاحظات'],...state.members.map(m=>[m.number,m.name,m.phone,m.plan,m.fee,m.startDate,m.endDate,m.status,m.balanceDue||0,m.barcode,m.notes])] }else if(type==='attendance'){name='FORCE-attendance';rows=[['التاريخ','الوقت','الاسم','رقم العضوية','نتيجة الحضور'],...state.attendance.map(a=>[a.date,a.time,a.name,a.number,a.ok?'تم':'غير نشط'])]}else{ name='FORCE-finance';rows=[['النوع','التاريخ','البيان','العضو','المبلغ','ملاحظات'],...state.payments.map(p=>['إيراد',p.date,p.type,p.memberName,p.amount,p.note]),...state.expenses.map(p=>['مصروف',p.date,p.category,'',p.amount,p.note])] }let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'-'+dateNow()+'.csv';a.click();URL.revokeObjectURL(a.href);toast('تم تجهيز ملف التقرير')}
function backup(){if(treasuryLocked()){requireTreasury(backup);return}logAction('نسخ احتياطي','تنزيل نسخة JSON');try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='FORCE-backup-'+dateNow()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('تم تنزيل النسخة الاحتياطية')}function restoreBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.members||!d.payments||!d.settings)throw Error();if(!confirm('سيتم استبدال البيانات الحالية بمحتوى النسخة الاحتياطية. هل تريد المتابعة؟'))return;state=d;state.auditLog ||= [];logAction('استعادة نسخة احتياطية','تم استيراد ملف JSON');save();toast('تمت استعادة النسخة الاحتياطية')}catch{alert('ملف النسخة الاحتياطية غير صالح')}e.target.value=''};r.readAsText(f)}
function showLogin(){if(!state.settings.loginPin||sessionStorage.getItem('forceUnlocked')==='1')return;const app=document.getElementById('mainApp'),box=document.getElementById('loginScreen');app.style.display='none';box.style.cssText='display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px;background:linear-gradient(#080b10bb,#080b10dd)'+(state.settings.loginBackground?`,url("${state.settings.loginBackground}")`: '')+';background-size:cover;background-position:center;';box.innerHTML=`<form onsubmit="unlockForce(event)" style="width:min(390px,100%);padding:30px;background:#15191fee;border:1px solid #343b45;border-radius:20px;box-shadow:0 20px 70px #0009;text-align:center;color:#f3f5f7"><div style="font-size:42px;font-weight:900;color:#ff8b32;margin-bottom:8px">FORCE</div><h2 style="margin:0 0 8px">تسجيل الدخول</h2><p style="color:#aab3bd;font-size:13px;margin-bottom:22px">أدخل رمز الدخول لفتح نظام إدارة الجيم</p><input id="loginPinInput" class="field" type="password" inputmode="numeric" autocomplete="current-password" placeholder="رمز الدخول" style="width:100%;margin-bottom:14px;text-align:center;letter-spacing:5px" autofocus><button class="btn" style="width:100%">دخول</button><div id="loginError" style="color:#ff9299;font-size:12px;margin-top:12px"></div><div style="color:#aab3bd;font-size:10px;margin-top:22px">تصميم مهندس علي أشرف</div></form>`}function unlockForce(e){e.preventDefault();let v=document.getElementById('loginPinInput').value;if(v===String(state.settings.loginPin||'')){sessionStorage.setItem('forceUnlocked','1');document.getElementById('loginScreen').style.display='none';document.getElementById('mainApp').style.display='flex';render()}else{document.getElementById('loginError').textContent='رمز الدخول غير صحيح، حاول مرة أخرى.';document.getElementById('loginPinInput').value='';document.getElementById('loginPinInput').focus()}}render();showLogin();
</script></body></html>
